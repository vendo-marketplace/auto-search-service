spring:
  cloud:
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false
  kafka:
    bootstrap-servers: localhost

eureka:
  client:
    enabled: false

security:
  jwt:
    secret:
      key: 63c43ae4e049015bcf8d7e59bcce8692e15ed390b68d75f60f218a118dfeaf89a52936c89bedda73b8689c5495808b25
      access-expiration-time: 60000
      refresh-expiration-time: 120000
    internal:
      key: 63c43ae4e049015bcf8d7e59bcce8692e15ed390b68d75f60f218a118dfeaf89a52936c89bedda73b8689c5495808b25
      expiration-time: 60000

endpoints:
  unauthenticated:
    general:
      - /actuator/health

kafka:
  events:
    product:
      created-event:
        topic: "PRODUCT_CREATED_EVENT_TOPIC"
        container-factory: "consumerContainerFactory"
        properties:
          auto-offset-reset: "latest"
    auto-search:
      ready-event:
        topic: "AUTO_SEARCH_READY_TOPIC"
        container-factory: "consumerContainerFactory"
      new-product-event:
        topic: "AUTO_SEARCH_NEW_PRODUCT_EVENT_TOPIC"
      matching-event:
        topic: "AUTO_SEARCH_MATCHING_TOPIC"
        container-factory: "consumerContainerFactory"
        properties:
          auto-offset-reset: "latest"
